[package]
name = "ciphersuite-mcp"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "index"
path = "src/main.rs"

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
hex = "0.4"
rand = "0.10"
rmcp = { version = "3.8", features = ["server", "transport-io"] }
schemars = "1"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
