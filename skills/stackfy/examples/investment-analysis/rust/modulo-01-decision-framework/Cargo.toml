[package]
name = "modulo-01-decision-framework"
version = "0.0.1"
edition = "2021"

[lib]
name = "decision_framework_tool"
path = "src/decision_framework_tool.rs"

[dependencies]
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
